# =============================================================================
# Datasource Loki no Grafana (logs dos projetos). O sidecar do Grafana do
# kube-prometheus-stack carrega todo ConfigMap com grafana_datasource=1.
# Loki/Alloy são instalados por scripts/setup-observability.sh.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-datasource-loki
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  loki.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        url: http://loki.monitoring.svc.cluster.local:3100
        access: proxy
        jsonData:
          maxLines: 1000
