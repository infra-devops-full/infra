# =============================================================================
# Dashboard genérico do Grafana: recursos de qualquer app de qualquer projeto.
# Variáveis: namespace (<projeto>-<env>) e app (Deployment). Aplicado pelo
# setup.sh; o sidecar do Grafana carrega todo ConfigMap com grafana_dashboard=1.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-dashboard-apps
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Platform"
data:
  platform-apps.json: |
    {
      "uid": "platform-apps",
      "title": "Platform / Apps (por projeto e ambiente)",
      "tags": [
        "platform",
        "apps"
      ],
      "timezone": "America/Sao_Paulo",
      "editable": true,
      "graphTooltip": 1,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "10s",
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Projeto-ambiente",
            "type": "query",
            "query": {
              "query": "label_values(kube_deployment_created, namespace)",
              "refId": "ns"
            },
            "regex": "/^(?!kube-system|kube-public|kube-node-lease|monitoring|argocd|default|tooling).*$/",
            "includeAll": true,
            "multi": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "app",
            "label": "App",
            "type": "query",
            "query": {
              "query": "label_values(kube_deployment_created{namespace=~\"$namespace\"}, deployment)",
              "refId": "app"
            },
            "includeAll": true,
            "multi": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2,
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Status",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "count(kube_pod_status_phase{namespace=~\"$namespace\", pod=~\"($app)-.*\", phase=\"Running\"})",
              "legendFormat": "Running Pods",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "steps": [
                  {
                    "color": "red",
                    "value": 0
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "title": "Réplicas",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 18,
            "x": 6,
            "y": 0
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_ready{namespace=~\"$namespace\", deployment=~\"$app\"}",
              "legendFormat": "{{ namespace }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              }
            }
          }
        },
        {
          "id": 3,
          "title": "CPU Usage",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\", pod=~\"($app)-.*\", container!=\"\", container!=\"POD\"}[5m])) by (namespace, pod)",
              "legendFormat": "{{ namespace }} / {{ pod }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never"
              }
            }
          }
        },
        {
          "id": 4,
          "title": "Memory Usage",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=~\"$namespace\", pod=~\"($app)-.*\", container!=\"\", container!=\"POD\"}) by (namespace, pod) / 1024 / 1024",
              "legendFormat": "{{ namespace }} / {{ pod }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "decmbytes",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never"
              }
            }
          }
        },
        {
          "id": 5,
          "title": "Network RX",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "targets": [
            {
              "expr": "sum(rate(container_network_receive_bytes_total{namespace=~\"$namespace\", pod=~\"($app)-.*\"}[5m])) by (namespace, pod)",
              "legendFormat": "{{ namespace }} / {{ pod }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never"
              }
            }
          }
        },
        {
          "id": 6,
          "title": "Network TX",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "targets": [
            {
              "expr": "sum(rate(container_network_transmit_bytes_total{namespace=~\"$namespace\", pod=~\"($app)-.*\"}[5m])) by (namespace, pod)",
              "legendFormat": "{{ namespace }} / {{ pod }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never"
              }
            }
          }
        },
        {
          "id": 7,
          "title": "Pod Restarts",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 20
          },
          "targets": [
            {
              "expr": "increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\", pod=~\"($app)-.*\"}[30m])",
              "legendFormat": "{{ namespace }} / {{ pod }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never"
              }
            }
          }
        },
        {
          "id": 8,
          "title": "CPU vs Memória",
          "type": "bargauge",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 20
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\", pod=~\"($app)-.*\", container!=\"\", container!=\"POD\"}[5m])) by (namespace) * 1000",
              "legendFormat": "{{ namespace }} CPU (mCores)",
              "refId": "A"
            },
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=~\"$namespace\", pod=~\"($app)-.*\", container!=\"\", container!=\"POD\"}) by (namespace) / 1024 / 1024",
              "legendFormat": "{{ namespace }} MEM (Mi)",
              "refId": "B"
            }
          ],
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient"
          }
        }
      ]
    }
