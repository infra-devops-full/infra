# =============================================================================
# Configuração dos agentes OpenTelemetry injetados nos apps (OpenTelemetry
# Operator, setup-tracing.sh). Um só para a plataforma: o chart aponta para
# ele com a annotation instrumentation.opentelemetry.io/inject-<linguagem>:
# "monitoring/platform" (values: `tracing.enabled` + `tracing.language`).
#
#   agente no app ──OTLP/HTTP :4318──► Alloy ──► Tempo
#
# Só traces: métricas continuam no Prometheus e logs no Loki (sem duplicar).
# Amostragem 100% (lab); em produção, algo como 10% (argument: "0.1") — a
# decisão é do primeiro serviço da chamada (parentbased) e vale para todos.
# docs/22-tracing.md
# =============================================================================
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: platform
  namespace: monitoring
spec:
  exporter:
    endpoint: http://alloy.monitoring.svc.cluster.local:4318
  propagators: [tracecontext, baggage]
  sampler:
    type: parentbased_traceidratio
    argument: "1"
  env:
    - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf }
    - { name: OTEL_METRICS_EXPORTER, value: none }
    - { name: OTEL_LOGS_EXPORTER, value: none }
  # resources = do init container que copia o agente (o Kyverno exige).
  java:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits:   { memory: 64Mi }
  nodejs:
    resourceRequirements:   # (no Node.js o campo tem outro nome)
      requests: { cpu: 10m, memory: 32Mi }
      limits:   { memory: 128Mi }
    env:
      # fs/dns/net geram um span por chamada de sistema: ruído sem valor.
      - { name: OTEL_NODE_DISABLED_INSTRUMENTATIONS, value: "fs,dns,net" }
      # Sem os detectores de nuvem (GCP/AWS/Azure): eles consultam metadados
      # que não existem aqui, atrasam a subida e logam MetadataLookupWarning.
      - { name: OTEL_NODE_RESOURCE_DETECTORS, value: "env,host,os,process,serviceinstance,container" }
