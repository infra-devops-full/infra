# =============================================================================
# NetworkPolicies de todo namespace de projeto, geradas pelo Kyverno.
#
# Quando um namespace recebe o label devops-platform/project (apply-project.sh),
# o Kyverno cria nele:
#   default-deny-ingress      ninguém entra...
#   allow-same-namespace      ...exceto pods do mesmo <projeto>-<env>,
#   allow-from-ingress-nginx  o NGINX Ingress (tráfego externo)
#   allow-from-monitoring     e o Prometheus;
#   allow-from-cnpg-operator  o operador do Postgres, só na porta de status
#                             (8000) dos pods de banco (docs/21-banco-de-dados.md).
# Resultado: crivo-develop não alcança wlstore-prod, nem develop alcança prod.
# synchronize: apagar ou editar uma delas à mão → o Kyverno desfaz.
# Saída (egress) fica liberada: DNS e APIs externas (Stripe, GHCR...).
# Detalhes: docs/14-seguranca.md
# =============================================================================
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: platform-namespace-network-baseline
  annotations:
    policies.kyverno.io/title: NetworkPolicies padrão dos namespaces de projeto
    policies.kyverno.io/category: Rede
spec:
  evaluation:
    generateExisting:
      enabled: true     # namespaces que já existiam também recebem
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
    objectSelector:
      matchExpressions:
        - { key: devops-platform/project, operator: Exists }
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: default-deny-ingress
            namespace: (( object.metadata.name ))
          spec:
            podSelector: {}
            policyTypes: [Ingress]
          ---
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: allow-same-namespace
            namespace: (( object.metadata.name ))
          spec:
            podSelector: {}
            policyTypes: [Ingress]
            ingress:
              - from:
                  - podSelector: {}
          ---
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: allow-from-ingress-nginx
            namespace: (( object.metadata.name ))
          spec:
            podSelector: {}
            policyTypes: [Ingress]
            ingress:
              - from:
                  - namespaceSelector:
                      matchLabels: { kubernetes.io/metadata.name: kube-system }
                    podSelector:
                      matchLabels: { app.kubernetes.io/name: ingress-nginx }
          ---
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: allow-from-monitoring
            namespace: (( object.metadata.name ))
          spec:
            podSelector: {}
            policyTypes: [Ingress]
            ingress:
              - from:
                  - namespaceSelector:
                      matchLabels: { kubernetes.io/metadata.name: monitoring }
          ---
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: allow-from-cnpg-operator
            namespace: (( object.metadata.name ))
          spec:
            podSelector:
              matchExpressions:
                - { key: cnpg.io/cluster, operator: Exists }
            policyTypes: [Ingress]
            ingress:
              - from:
                  - namespaceSelector:
                      matchLabels: { kubernetes.io/metadata.name: cnpg-system }
                ports:
                  - { protocol: TCP, port: 8000 }
