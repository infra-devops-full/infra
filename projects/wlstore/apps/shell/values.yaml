# shell (Next.js, host do Nx) — valores comuns a todos os ambientes.
# app.name / app.environment / app.project são injetados pelo ArgoCD
# (a partir do caminho deste arquivo).
#
# Host do projeto (Next.js Multi-Zones): o shell responde em "/" e cada
# microfrontend em seu basePath, no MESMO host (ingress.host nos
# values-<env>.yaml). Quem roteia é o NGINX Ingress — o shell não faz proxy e
# não precisa ser rebuildado quando uma equipe sobe um mfe novo.

image:
  # Publicada pelo CI do repo wlstore: wlstore-fe/Dockerfile com APP=shell.
  repository: ghcr.io/geraldobl58/wlstore/shell
  pullPolicy: IfNotPresent

service:
  port: 3000

livenessProbe:
  path: /
readinessProbe:
  path: /

resources:
  limits:
    cpu: 500m
    memory: 384Mi
  requests:
    cpu: 20m
    memory: 128Mi
