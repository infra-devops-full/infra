# image.tag: atualizado pelo CI do app a cada push na main (merge do PR develop → main).
image:
  tag: 1.2.0
ingress:
  host: wlstore.local # domínio do projeto em prod: o front responde em /
# Canary (Argo Rollouts): a versão nova recebe 20% e depois 50% dos requests,
# com análise de 5xx no Prometheus; reprovou → volta sozinha. docs/15-entrega-progressiva.md
rollout:
  enabled: true
release:
  version: 1.2.0
  url: https://github.com/whitelabel-store/wlstore-fe/releases/tag/v1.2.0
