# pricing-mfe (Next.js, microfrontend do Nx) — valores comuns a todos os ambientes.
# app.name / app.environment / app.project são injetados pelo ArgoCD
# (a partir do caminho deste arquivo).
#
# Microfrontend (Next.js Multi-Zones): divide o host do projeto com o shell
# (ingress.host nos values-<env>.yaml) e o NGINX Ingress manda para cá tudo que
# começa com o basePath. Contrato com as outras equipes:
#   ingress.path  ==  basePath do next.config.js  (único por mfe)

image:
  # Publicada pelo CI do repo wlstore: wlstore-fe/Dockerfile com APP=pricing-mfe.
  repository: ghcr.io/geraldobl58/wlstore/pricing-mfe
  pullPolicy: IfNotPresent

service:
  port: 4300

ingress:
  path: /pricing

# basePath /pricing: a raiz "/" responde 404.
livenessProbe:
  path: /pricing
readinessProbe:
  path: /pricing

resources:
  limits:
    cpu: 500m
    memory: 384Mi
  requests:
    cpu: 20m
    memory: 128Mi
