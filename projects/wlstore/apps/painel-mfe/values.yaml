# painel-mfe (Next.js) — painel do lojista. Valores comuns a todos os ambientes.
# app.name / app.environment / app.project são injetados pelo ArgoCD.
#
# Divide o host do projeto com a vitrine (ingress.host nos values-<env>.yaml);
# o NGINX Ingress manda para cá tudo que começa com o basePath. Contrato:
#   ingress.path  ==  basePath do next.config.js
# Repo: github.com/whitelabel-store/wlstore-painel.

image:
  # Publicada pelo CI do repo wlstore-painel.
  repository: ghcr.io/whitelabel-store/wlstore-painel/painel-mfe
  pullPolicy: IfNotPresent

service:
  port: 4300

ingress:
  path: /painel

# basePath /painel: a raiz "/" responde 404.
livenessProbe:
  path: /painel
readinessProbe:
  path: /painel

env:
  PRICING_API_URL: "http://pricing-service:8082"

resources:
  limits:
    cpu: 500m
    memory: 384Mi
  requests:
    cpu: 20m
    memory: 128Mi
