# crivo-be (NestJS) — valores comuns a todos os ambientes.
# app.name / app.environment / app.project são injetados pelo ArgoCD
# (a partir do caminho deste arquivo).

image:
  # Publicada pelo CI do repo crivo (.github/workflows/deploy.yml), a partir
  # do Dockerfile da raiz do repo (o mesmo usado no Fly.io).
  repository: ghcr.io/geraldobl58/crivo/crivo-be
  pullPolicy: IfNotPresent

service:
  # O Dockerfile fixa PORT=8080.
  port: 8080

# O container roda `prisma migrate deploy` antes de subir a API, então o
# primeiro start demora mais. /health consulta o banco.
livenessProbe:
  path: /health
  initialDelaySeconds: 45
readinessProbe:
  path: /health
  initialDelaySeconds: 20

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 192Mi

env:
  PORT: "8080"
  NODE_ENV: production
  SWAGGER_ENABLED: "false"
  # `fake` não envia WhatsApp de verdade — bom para o lab.
  MESSAGING_PROVIDER: fake
  REMINDER_HOURS_BEFORE: "24"

envFrom:
  - secretRef: postgres     # DATABASE_URL, DIRECT_URL  (database no project.yaml)
  - secretRef: redis        # REDIS_URL                 (redis no project.yaml)
  - secretRef: app-secrets  # JWT_SECRET, STRIPE_*, ... (secrets/<env>.env)
