# =============================================================================
# Projeto: crivo
# -----------------------------------------------------------------------------
# Nome do projeto = nome da pasta. Apps e ambientes vêm das pastas:
#   apps/crivo-be/  API NestJS (porta 8080, migra o banco no start)
#   apps/crivo-fe/  Next.js   (porta 3000, chama a API pelo Service interno)
# → namespaces crivo-develop / crivo-prod
# → front: <env>.crivo.local (domínio do projeto)
# → API:   <env>.crivo-be.crivo.local
#
# Aqui só vai o que a plataforma provisiona por namespace.
# =============================================================================

# Texto do projeto na UI do ArgoCD (AppProject).
description: "Crivo — API NestJS (crivo-be) e front Next.js (crivo-fe)"

# Código da aplicação (documentação — quem builda é o CI desse repo).
appRepo: https://github.com/crivo-sync/crivo

# Postgres por ambiente → Secret `postgres` (DATABASE_URL, JDBC_URL, DB_*).
# A SENHA não fica aqui: é gerada e selada por `make seal` (sealed/<env>/).
database:
  user: crivo
  defaultDb: crivo
  # 1 instância também em prod: o Docker desta máquina (16 GB) não aguenta
  # réplica em todos os bancos. Com folga, 2 = failover automático.
  instances:
    prod: 1

# Redis por ambiente (BullMQ) → Secret `redis` (REDIS_URL, REDIS_HOST, ...).
redis:
  enabled: true

# Demais segredos do crivo-be (JWT, Stripe, Cloudinary, ...) → Secret
# `app-secrets`, a partir de secrets/<env>.env (gitignored) ou, na falta dele,
# secrets/example.env (valores de lab).

# Quem desenvolve este projeto (times do GitHub, "<org>:<time>"): sync,
# rollback e ações do canary só nos apps deste projeto. docs/18-login-sso.md
access:
  devs:
    - crivo-sync:devs
