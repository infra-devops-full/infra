# products (NestJS) — valores comuns a todos os ambientes.
# app.name / app.environment / app.project são injetados pelo ArgoCD
# (a partir do caminho deste arquivo).

image:
  # Publicada pelo CI do repo do app (.github/workflows/deploy.yml)
  repository: ghcr.io/geraldobl58/microservice-with-nestjs-rabbitmq/products
  pullPolicy: IfNotPresent

service:
  port: 3000

livenessProbe:
  path: /
readinessProbe:
  path: /

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 20m
    memory: 96Mi

env:
  PORT: "3000"

# Secret criado pela plataforma (rabbitmq.enabled no project.yaml)
envFrom:
  - secretRef: rabbitmq

# Traces no Tempo: o OpenTelemetry Operator injeta o agente (Node.js) no pod,
# sem mudar o código. docs/22-tracing.md
tracing:
  enabled: true
  language: nodejs
