{{- $name := required "project.name é obrigatório" .Values.project.name -}}
{{- $repos := .Values.appRepos | default (compact (list .Values.appRepo)) -}}
# AppProject de um projeto: agrupa os apps dele na UI do ArgoCD e limita onde
# eles podem ser aplicados (só os namespaces <projeto>-<env>).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ $name }}
  namespace: argocd
  labels:
    devops-platform/project: {{ $name }}
  {{- with $repos }}
  annotations:
    {{- range $i, $repo := . }}
    devops-platform/app-repo-{{ $i }}: {{ $repo | quote }}
    {{- end }}
  {{- end }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: {{ .Values.description | default (printf "Projeto %s (projects/%s)" $name $name) | quote }}
  sourceRepos:
    - {{ required "infraRepoUrl é obrigatório" .Values.infraRepoUrl | quote }}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: {{ printf "%s-*" $name | quote }}
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  {{- with (.Values.access).devs }}
  # Perfil "dev do projeto" (login único, docs/18-login-sso.md): quem está num
  # destes times do GitHub opera SÓ os apps deste projeto. Leitura do resto
  # vem do policy.default (role:readonly) do ArgoCD.
  roles:
    - name: dev
      description: Desenvolvedores do projeto {{ $name }}
      groups:
        {{- toYaml . | nindent 8 }}
      policies:
        - p, proj:{{ $name }}:dev, applications, get, {{ $name }}/*, allow
        - p, proj:{{ $name }}:dev, applications, sync, {{ $name }}/*, allow
        - p, proj:{{ $name }}:dev, applications, action/*, {{ $name }}/*, allow
        - p, proj:{{ $name }}:dev, logs, get, {{ $name }}/*, allow
  {{- end }}
