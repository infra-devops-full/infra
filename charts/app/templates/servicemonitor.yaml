{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
    # O Service -canary (Rollout) tem os mesmos labels: não coletar duas vezes.
    matchExpressions:
      - key: devops-platform/service-role
        operator: NotIn
        values: [canary]
  endpoints:
    - port: http
      path: {{ .Values.metrics.path }}
      interval: 30s
      scrapeTimeout: 10s
{{- end }}
