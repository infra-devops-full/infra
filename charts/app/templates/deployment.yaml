{{- /*
Deployment, ou Rollout (Argo Rollouts) com rollout.enabled: o pod é o mesmo;
o Rollout troca a estratégia de atualização por canary com análise.
*/ -}}
{{- $rollout := .Values.rollout.enabled -}}
{{- $fullname := include "app.fullname" . -}}
apiVersion: {{ ternary "argoproj.io/v1alpha1" "apps/v1" $rollout }}
kind: {{ ternary "Rollout" "Deployment" $rollout }}
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  {{- with .Values.release }}
  {{- if .version }}
  annotations:
    # Versão no ar e link para o changelog (GitHub Release): o ArgoCD mostra
    # o link no recurso. Preenchidos pelo release.yml do repo do app.
    devops-platform/release: {{ .version | quote }}
    {{- if .url }}
    link.argocd.argoproj.io/external-link: {{ .url | quote }}
    {{- end }}
  {{- end }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if $rollout }}
  revisionHistoryLimit: 3
  # Versão nova que não fica pronta nesse prazo → aborta e volta à estável.
  progressDeadlineSeconds: {{ .Values.rollout.progressDeadlineSeconds }}
  progressDeadlineAbort: true
  # Voltar para uma das últimas N versões (rollback) pula os passos do canary:
  # aquela versão já rodou 100% em produção.
  rollbackWindow:
    revisions: {{ .Values.rollout.rollbackWindow }}
  strategy:
    canary:
      stableService: {{ $fullname }}
      canaryService: {{ $fullname }}-canary
      {{- if and .Values.ingress.enabled (include "app.ingressHost" .) }}
      # O controller cria um Ingress "-canary" (annotations canary-weight do
      # NGINX) e move o peso a cada passo: % de requests, não de pods.
      trafficRouting:
        nginx:
          stableIngress: {{ $fullname }}
      {{- end }}
      {{- if .Values.rollout.analysis.enabled }}
      # Análise em segundo plano desde o 1º passo: falhou → aborta → rollback.
      analysis:
        startingStep: 1
        templates:
          - templateName: {{ .Values.rollout.analysis.template }}
            clusterScope: true
        args:
          - name: namespace
            value: {{ .Release.Namespace | quote }}
          - name: canary-service
            value: {{ printf "%s-canary" $fullname | quote }}
          - name: max-error-rate
            value: {{ .Values.rollout.analysis.maxErrorRate | quote }}
      {{- end }}
      steps:
        {{- toYaml .Values.rollout.steps | nindent 8 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- range . }}
        - name: {{ .name }}
          image: {{ .image | default (printf "%s:%s" $.Values.image.repository $.Values.image.tag) }}
          {{- with .command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or $.Values.env .env }}
          env:
            {{- include "app.envVars" $ | nindent 12 }}
            {{- with .env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if $.Values.envFrom }}
          envFrom:
            {{- range $.Values.envFrom }}
            {{- if .secretRef }}
            - secretRef:
                name: {{ .secretRef }}
                {{- if .optional }}
                optional: true
                {{- end }}
            {{- else if .configMapRef }}
            - configMapRef:
                name: {{ .configMapRef }}
                {{- if .optional }}
                optional: true
                {{- end }}
            {{- end }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ include "app.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- range .Values.extraPorts }}
            - name: {{ .name }}
              containerPort: {{ .containerPort }}
              protocol: {{ .protocol | default "TCP" }}
            {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: {{ .Values.livenessProbe.port | default "http" }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: {{ .Values.readinessProbe.port | default "http" }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.env }}
          env:
            {{- include "app.envVars" . | nindent 12 }}
          {{- end }}
          {{- if .Values.envFrom }}
          envFrom:
            {{- range .Values.envFrom }}
            {{- if .secretRef }}
            - secretRef:
                name: {{ .secretRef }}
                {{- if .optional }}
                optional: true
                {{- end }}
            {{- else if .configMapRef }}
            - configMapRef:
                name: {{ .configMapRef }}
                {{- if .optional }}
                optional: true
                {{- end }}
            {{- end }}
            {{- end }}
          {{- end }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
