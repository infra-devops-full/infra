# =============================================================================
# Chart genérico da plataforma - defaults
# =============================================================================
# Cada app de projeto sobrescreve estes valores em:
#   projects/<projeto>/apps/<app>/values.yaml        (comum a todos ambientes)
#   projects/<projeto>/apps/<app>/values-<env>.yaml  (overrides do ambiente)
# =============================================================================

# Identificação. Preenchida AUTOMATICAMENTE pelo ApplicationSet gerado
# (scripts/render-argocd.sh) — não precisa repetir nos values do app.
app:
  name: ""           # nome do app (ex.: products)
  environment: ""    # ambiente (ex.: develop)
  project: ""        # projeto (ex.: nest-rabbitmq) — usado no host padrão

replicaCount: 1

image:
  repository: ""
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-secret

service:
  type: ClusterIP
  port: 3000

# Portas extras expostas no container (útil pra Keycloak que separa management
# em 9000). Não são publicadas via Service por padrão.
#   extraPorts:
#     - name: management
#       containerPort: 9000
extraPorts: []

# args opcionais no container (usado pelo Keycloak)
args: []

ingress:
  enabled: true
  className: nginx
  annotations: {}
  # Vazio => <env>.<app>.<projeto>.local (ex.: develop.products.nest-rabbitmq.local);
  #          em prod, sem prefixo: <app>.<projeto>.local (ex.: products.nest-rabbitmq.local)
  host: ""
  path: /
  pathType: Prefix
  # HTTPS: o cert-manager emite o certificado do host (Secret <app>-tls).
  # No lab o emissor é a CA local (make trust-ca para o navegador confiar);
  # na nuvem, troque por um ClusterIssuer do Let's Encrypt.
  tls:
    enabled: true
    clusterIssuer: platform-ca
    secretName: ""        # vazio => <app>-tls
    # Lab: http e https respondem (curl/CI sem a CA continuam funcionando).
    # Produção real: true (redireciona para https) e HSTS.
    sslRedirect: false

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 64Mi

livenessProbe:
  enabled: true
  path: /
  port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 5

readinessProbe:
  enabled: true
  path: /
  port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 5

# Entrega progressiva (Argo Rollouts). true = Rollout canary em vez de
# Deployment: a versão nova recebe uma fração dos requests (pelo NGINX
# Ingress) enquanto a análise confere a taxa de 5xx dela no Prometheus.
# Passou em todos os passos → vira a estável. Falhou → aborta e volta sozinho.
rollout:
  enabled: false
  steps:
    - setWeight: 20
    - pause: { duration: 2m }
    - setWeight: 50
    - pause: { duration: 2m }
  analysis:
    enabled: true
    # ClusterAnalysisTemplate em k8s/rollouts-analysis.yaml
    template: platform-canary-error-rate
    maxErrorRate: "0.05"     # 5% de 5xx na versão nova = aborta
  progressDeadlineSeconds: 600
  # Rollback para uma das últimas N versões é imediato (sem canary).
  rollbackWindow: 3

# Versão publicada (preenchido pelo release.yml nos values-prod.yaml).
release:
  version: ""
  url: ""

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# env: map (chave: valor). Conversão para lista é feita no template.
# Use ${ENV} em strings para referenciar app.environment via tpl render.
env: {}

# initContainers: rodam ANTES do container principal. Útil pra migrations
# (Prisma migrate deploy, etc.). Herdam env + envFrom do container principal.
#   initContainers:
#     - name: migrate
#       command: ["sh", "-c", "npx prisma migrate deploy"]
initContainers: []

# envFrom: lista de Secrets/ConfigMaps cujas chaves viram env vars.
# Secrets que a plataforma cria no namespace <projeto>-<env>:
#   postgres     DATABASE_URL                      (database no project.yaml)
#   redis        REDIS_URL, REDIS_HOST, REDIS_PORT (redis.enabled)
#   rabbitmq     RABBITMQ_URL, ...                 (rabbitmq.enabled)
#   app-secrets  chaves de projects/<p>/secrets/<env>.env
#   envFrom:
#     - secretRef: postgres
#     - secretRef: app-secrets
#       optional: true             # o pod sobe mesmo se o Secret não existir
envFrom: []

extraVolumes: []
extraVolumeMounts: []

# hostAliases é específico do lab k3d (quando precisamos que pods resolvam
# domínios <...>.local que apontam para o ingress controller).
hostAliases: []

podDisruptionBudget:
  enabled: false
  minAvailable: 1

podAnnotations: {}

# Se o app expõe métricas Prometheus em `path` (porta http), habilite os dois
# para o Prometheus da plataforma coletar (gera um ServiceMonitor).
metrics:
  enabled: false
  path: /metrics
  serviceMonitor:
    enabled: false
