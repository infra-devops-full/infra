# =============================================================================
# Chart genérico da plataforma - defaults
# =============================================================================
# Cada app de projeto sobrescreve estes valores em:
#   projects/<projeto>/apps/<app>/values.yaml        (comum a todos ambientes)
#   projects/<projeto>/apps/<app>/values-<env>.yaml  (overrides do ambiente)
# =============================================================================

# Identificação. Preenchida AUTOMATICAMENTE pelo ApplicationSet gerado
# (scripts/render-argocd.sh) — não precisa repetir nos values do app.
app:
  name: ""           # nome do app (ex.: products)
  environment: ""    # ambiente (ex.: develop)
  project: ""        # projeto (ex.: nest-rabbitmq) — usado no host padrão

replicaCount: 1

image:
  repository: ""
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-secret

service:
  type: ClusterIP
  port: 3000

# Portas extras expostas no container (útil pra Keycloak que separa management
# em 9000). Não são publicadas via Service por padrão.
#   extraPorts:
#     - name: management
#       containerPort: 9000
extraPorts: []

# args opcionais no container (usado pelo Keycloak)
args: []

ingress:
  enabled: true
  className: nginx
  annotations: {}
  # Vazio => <env>.<app>.<projeto>.local (ex.: develop.products.nest-rabbitmq.local);
  #          em prod, sem prefixo: <app>.<projeto>.local (ex.: products.nest-rabbitmq.local)
  host: ""
  path: /
  pathType: Prefix

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 64Mi

livenessProbe:
  enabled: true
  path: /
  port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 5

readinessProbe:
  enabled: true
  path: /
  port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# env: map (chave: valor). Conversão para lista é feita no template.
# Use ${ENV} em strings para referenciar app.environment via tpl render.
env: {}

# initContainers: rodam ANTES do container principal. Útil pra migrations
# (Prisma migrate deploy, etc.). Herdam env + envFrom do container principal.
#   initContainers:
#     - name: migrate
#       command: ["sh", "-c", "npx prisma migrate deploy"]
initContainers: []

# envFrom: lista de Secrets/ConfigMaps cujas chaves viram env vars.
# Secrets que a plataforma cria no namespace <projeto>-<env>:
#   postgres     DATABASE_URL                      (database no project.yaml)
#   redis        REDIS_URL, REDIS_HOST, REDIS_PORT (redis.enabled)
#   rabbitmq     RABBITMQ_URL, ...                 (rabbitmq.enabled)
#   app-secrets  chaves de projects/<p>/secrets/<env>.env
#   envFrom:
#     - secretRef: postgres
#     - secretRef: app-secrets
#       optional: true             # o pod sobe mesmo se o Secret não existir
envFrom: []

extraVolumes: []
extraVolumeMounts: []

# hostAliases é específico do lab k3d (quando precisamos que pods resolvam
# domínios <...>.local que apontam para o ingress controller).
hostAliases: []

podDisruptionBudget:
  enabled: false
  minAvailable: 1

podAnnotations: {}

# Se o app expõe métricas Prometheus em `path` (porta http), habilite os dois
# para o Prometheus da plataforma coletar (gera um ServiceMonitor).
metrics:
  enabled: false
  path: /metrics
  serviceMonitor:
    enabled: false
