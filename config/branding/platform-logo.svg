<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Logo da DevOps Platform (lab): hexágono (Kubernetes) + laço de entrega
       contínua (Git → cluster → Git). PNG gerado por scripts/dev/gen-grafana.py. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B5BDB"/>
      <stop offset="1" stop-color="#7048E8"/>
    </linearGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63E6BE"/>
      <stop offset="1" stop-color="#FFD43B"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <polygon points="128,40 204,84 204,172 128,216 52,172 52,84" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="12" stroke-linejoin="round"/>
  <path d="M86 128 C86 100, 112 100, 128 128 S170 156, 170 128 S144 100, 128 128 S86 156, 86 128 Z" fill="none" stroke="url(#loop)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="128" cy="128" r="9" fill="#ffffff"/>
</svg>
