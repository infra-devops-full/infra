# k3d configuration (template) — renderizado por setup.sh via envsubst.
# Variáveis: ${CLUSTER_NAME} ${DATA_DIR} ${K3D_AGENTS}
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: ${CLUSTER_NAME}
servers: 1
# Cada node é um k3s inteiro (kubelet + containerd): mais nodes = mais CPU
# ociosa. Para o lab, 1 server + 1 agent basta. Ajuste com K3D_AGENTS no .env.
agents: ${K3D_AGENTS}
# Versão do Kubernetes: manter dentro das suportadas (as 3 últimas minors).
# Trocar exige recriar o cluster (make destroy && make setup).
image: rancher/k3s:v1.34.12-k3s1

# Porta para acessar serviços externos
ports:
  - port: 80:80
    nodeFilters:
      - loadbalancer
  - port: 443:443
    nodeFilters:
      - loadbalancer

# Volumes persistentes no HOST (DATA_DIR — default ~/.devops-lab, disco interno)
volumes:
  - volume: ${DATA_DIR}/data:/var/lib/rancher/k3s/storage
    nodeFilters:
      - all
  - volume: ${DATA_DIR}/postgres:/var/lib/postgresql/data
    nodeFilters:
      - server:0

# Labels para os nodes
options:
  k3d:
    wait: true
    timeout: "120s"
    disableLoadbalancer: false
  k3s:
    extraArgs:
      # Banco do cluster: etcd embutido em vez do SQLite padrão do k3s. Com
      # dezenas de controllers (ArgoCD, Kyverno, CNPG, Prometheus...) o SQLite
      # vira gargalo ("Slow SQL" nos logs): a renovação dos leases atrasa, o
      # node fica NotReady, pods são despejados e recriados, e a CPU explode.
      - arg: --cluster-init
        nodeFilters:
          - server:0
      # Um server só: eleição de líder não tem com quem disputar, mas, se a
      # renovação do lease atrasa (CPU/disco saturados), o controller encerra
      # o k3s inteiro ("leaderelection lost") e todos os pods do node caem.
      - arg: --kube-controller-manager-arg=leader-elect=false
        nodeFilters:
          - server:*
      - arg: --kube-scheduler-arg=leader-elect=false
        nodeFilters:
          - server:*
      - arg: --kube-cloud-controller-manager-arg=leader-elect=false
        nodeFilters:
          - server:*
      - arg: --disable=traefik
        nodeFilters:
          - server:*
      - arg: --disable=metrics-server
        nodeFilters:
          - server:*
      - arg: --tls-san=devops.local
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
  runtime:
    labels:
      - label: environment=local
        nodeFilters:
          - all
      - label: tier=compute
        nodeFilters:
          - agent:*

# Registry local
registries:
  create:
    name: registry.devops.local
    host: "0.0.0.0"
    hostPort: "5000"
  config: |
    mirrors:
      "registry.devops.local:5000":
        endpoint:
          - http://registry.devops.local:5000
