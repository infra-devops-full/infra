# =============================================================================
# Notificações de DEPLOY no Discord (#deploys), pelo ArgoCD Notifications.
# Aplicado por setup-notifications.sh (make notifications) quando o Secret
# argocd-notifications-secret existe. docs/20-notificacoes.md
#
#   🚀 release X.Y.Z em prod / 🧪 build sha-xxx em develop
#        uma vez por VERSÃO do app (tag da imagem do próprio app): mudança só
#        de configuração na infra não avisa; ela aparece no ArgoCD e no Git
#   ❌ sync falhou                              (manifesto inválido, política recusou...)
#   ⚠️ app degradado                            (inclui canary abortado)
#
# Só Applications de app (label devops-platform/kind=app): as de segredos e
# de projeto não notificam. A URL do webhook fica no Secret selado
# (config/notifications/argocd-notifications.sealed.yaml).
# =============================================================================
notifications:
  enabled: true
  argocdUrl: https://argocd.devops.local
  secret:
    create: false        # vem do SealedSecret argocd-notifications-secret
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits:   { memory: 128Mi }

  notifiers:
    service.webhook.discord-deploys: |
      url: $discord-deploys-url
      headers:
        - name: Content-Type
          value: application/json

  subscriptions:
    - recipients: [discord-deploys]
      selector: devops-platform/kind=app
      triggers: [on-deployed, on-sync-failed, on-health-degraded]

  triggers:
    trigger.on-deployed: |
      # Uma vez por versão do APP: a tag da imagem dele (a do agente de
      # tracing e outras do pod ficam de fora). Antes era por revisão do repo
      # de infra, e um commit de configuração avisava como se fosse deploy.
      # Só quando sobra UMA imagem do app: durante o canary as duas versões
      # convivem (1.1.0,1.2.0 → 1.2.0) e a chave mudaria, repetindo o aviso.
      # Só syncs dos últimos 30 min (cobre o canary): apps que já estavam no
      # ar não avisam de novo quando esta regra muda ou o controller reinicia.
      - description: Versão nova do app no ar (canary concluído)
        oncePer: join(filter(app.status.summary.images, {# contains ("/" + app.metadata.labels["devops-platform/app"] + ":")}), ",")
        send: [app-deployed]
        when: >-
          app.status.operationState != nil and app.status.operationState.phase in ['Succeeded']
          and app.status.health.status == 'Healthy'
          and len(filter(app.status.summary.images, {# contains ("/" + app.metadata.labels["devops-platform/app"] + ":")})) == 1
          and time.Now().Sub(time.Parse(app.status.operationState.finishedAt)).Minutes() < 30
    trigger.on-sync-failed: |
      - description: Sync falhou
        oncePer: app.status.operationState?.syncResult?.revision
        send: [app-sync-failed]
        when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
    trigger.on-health-degraded: |
      - description: App degradado
        oncePer: app.status.operationState?.syncResult?.revision
        send: [app-health-degraded]
        when: app.status.health.status == 'Degraded'

  templates:
    # prod: a versão chega por release (make release) → "Release X.Y.Z", com
    # link para o changelog. develop: cada push vira um build sha-<commit>.
    # O repo do app sai do nome da imagem (convenção do CI:
    # ghcr.io/<org>/<repo>/<app>); a tag do release é v<versão>.
    template.app-deployed: |
      webhook:
        discord-deploys:
          method: POST
          body: |
            {{- $l := .app.metadata.labels -}}
            {{- $app := index $l "devops-platform/app" -}}
            {{- $env := index $l "devops-platform/env" -}}
            {{- $prod := eq $env "prod" -}}
            {{- $img := "" -}}{{- range .app.status.summary.images -}}{{- if contains (printf "/%s:" $app) . -}}{{- $img = . -}}{{- end -}}{{- end -}}
            {{- $ver := splitList ":" $img | last | default "?" -}}
            {{- $parts := splitList "/" (splitList ":" $img | first) -}}
            {{- $repo := "" -}}{{- if ge (len $parts) 3 -}}{{- $repo = printf "https://github.com/%s/%s" (index $parts 1) (index $parts 2) -}}{{- end -}}
            {{- $link := "" -}}
            {{- if and $repo $prod -}}{{- $link = printf "[v%s](%s/releases/tag/v%s)" $ver $repo $ver -}}
            {{- else if and $repo (hasPrefix "sha-" $ver) -}}{{- $link = printf "[%s](%s/commit/%s)" (trimPrefix "sha-" $ver) $repo (trimPrefix "sha-" $ver) -}}{{- end -}}
            {
              "username": "ArgoCD",
              "embeds": [{
                "title": {{ ternary (printf "🚀 Release %s · %s em prod" $ver $app) (printf "🧪 %s · %s em develop" $ver $app) $prod | toJson }},
                "url": {{ printf "%s/applications/argocd/%s" .context.argocdUrl .app.metadata.name | toJson }},
                "color": {{ ternary 3066993 3447003 $prod }},
                "description": {{ ternary (printf "Versão `%s` no ar em `%s` (canary 20%% → 50%% → 100%% concluído)." $ver .app.spec.destination.namespace) (printf "Build `%s` no ar em `%s`. Teste e, quando aprovar, `make release PROJECT=%s`." $ver .app.spec.destination.namespace (index $l "devops-platform/project")) $prod | toJson }},
                "fields": [
                  {"name": "Projeto", "value": {{ index $l "devops-platform/project" | toJson }}, "inline": true},
                  {"name": "Versão", "value": {{ $ver | toJson }}, "inline": true}
                  {{- if $link -}},
                  {"name": {{ ternary "Changelog" "Commit" $prod | toJson }}, "value": {{ $link | toJson }}, "inline": true}
                  {{- end }}
                ]
              }]
            }
    template.app-sync-failed: |
      webhook:
        discord-deploys:
          method: POST
          body: |
            {{- $l := .app.metadata.labels -}}
            {
              "username": "ArgoCD",
              "embeds": [{
                "title": {{ printf "❌ sync falhou: %s → %s" (index $l "devops-platform/app") (index $l "devops-platform/env") | toJson }},
                "url": {{ printf "%s/applications/argocd/%s?operation=true" .context.argocdUrl .app.metadata.name | toJson }},
                "color": 15158332,
                "description": {{ .app.status.operationState.message | trunc 1500 | toJson }},
                "fields": [
                  {"name": "Projeto", "value": {{ index $l "devops-platform/project" | toJson }}, "inline": true},
                  {"name": "O que fazer", "value": "Abra o link: *Sync Status* mostra o recurso e o erro. Recusa de política → `make policy-check`.", "inline": false}
                ]
              }]
            }
    template.app-health-degraded: |
      webhook:
        discord-deploys:
          method: POST
          body: |
            {{- $l := .app.metadata.labels -}}
            {{- $d := "" -}}
            {{- range .app.status.resources -}}
            {{- if and .health (eq .health.status "Degraded") -}}
            {{- $d = printf "%s• %s/%s: %s\n" $d .kind .name (.health.message | default "") -}}
            {{- end -}}
            {{- end -}}
            {
              "username": "ArgoCD",
              "embeds": [{
                "title": {{ printf "⚠️ degradado: %s → %s" (index $l "devops-platform/app") (index $l "devops-platform/env") | toJson }},
                "url": {{ printf "%s/applications/argocd/%s" .context.argocdUrl .app.metadata.name | toJson }},
                "color": 15105570,
                "description": {{ printf "%s\nNum canary, *RolloutAborted* quer dizer que a versão estável continua no ar: corrija e publique outra versão, ou `make rollback`." ($d | trunc 1500) | toJson }},
                "fields": [
                  {"name": "Projeto", "value": {{ index $l "devops-platform/project" | toJson }}, "inline": true}
                ]
              }]
            }
