# =============================================================================
# Loki (grafana/loki) — modo SINGLE-BINARY enxuto para o lab.
# Aplicado por scripts/setup-observability.sh.
#
# O default do chart é distribuído (read/write/backend × 3 + memcached +
# canary): pesado demais para rodar num Mac. Aqui é 1 pod, filesystem e
# retenção de 3 dias. Os logs são voláteis (emptyDir), como o Postgres do lab.
# =============================================================================
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 72h
    allow_structured_metadata: true
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: false
  extraVolumes:
    - name: data
      emptyDir:
        sizeLimit: 2Gi
  extraVolumeMounts:
    - name: data
      mountPath: /var/loki
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

# Componentes do modo distribuído: desligados.
read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
gateway: { enabled: false }
sidecar:
  rules:
    enabled: false
