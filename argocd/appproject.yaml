# =============================================================================
# AppProject da PLATAFORMA (não de um projeto).
# Renderizado com envsubst (${INFRA_REPO_URL}) por setup.sh / make apply-argocd.
#
# Só guarda as Applications `project-<p>`, que criam o AppProject de cada
# projeto (argocd/applicationset-projects.yaml). Os apps e os segredos de cada
# projeto ficam no AppProject dele, com destino restrito a <projeto>-<env>.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Plataforma — um AppProject por pasta de projects/
  sourceRepos:
    - ${INFRA_REPO_URL}
  # Só cria AppProjects, e só no namespace do ArgoCD.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: AppProject
