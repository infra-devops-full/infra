# =============================================================================
# ApplicationSet genérico dos SEGREDOS: cada pasta projects/<p>/sealed/<env>/
# no Git vira uma Application que aplica os SealedSecrets no namespace
# <p>-<env>. O controller do Sealed Secrets (kube-system) abre cada um no
# Secret correspondente (postgres, rabbitmq, redis, app-secrets).
# Renderizado com envsubst (${INFRA_REPO_URL} ${INFRA_BRANCH}).
#
# Mudar um segredo = `make seal PROJECT=<p>` + commit. Nada aqui muda.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-secrets
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: ${INFRA_REPO_URL}
        revision: ${INFRA_BRANCH}
        directories:
          - path: "projects/*/sealed/*"
  template:
    metadata:
      name: '{{ index .path.segments 1 }}-secrets-{{ .path.basename }}'
      labels:
        devops-platform/project: '{{ index .path.segments 1 }}'
        devops-platform/env: '{{ .path.basename }}'
        devops-platform/kind: secrets
    spec:
      project: '{{ index .path.segments 1 }}'
      source:
        repoURL: ${INFRA_REPO_URL}
        targetRevision: ${INFRA_BRANCH}
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ index .path.segments 1 }}-{{ .path.basename }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
  syncPolicy:
    preserveResourcesOnDeletion: false
